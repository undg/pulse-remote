name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Verify tag is on master
        run: |
          git branch -r --contains ${{ github.ref_name }} | grep -q 'origin/master' || \
          (echo "Tag ${{ github.ref_name }} is not on master branch. Aborting." && exit 1)

      - name: Set up Go
        uses: jdx/mise-action@v4

      - name: Build release artifacts
        run: make package

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            pulse-remote_*.tar.gz
            checksums.txt
